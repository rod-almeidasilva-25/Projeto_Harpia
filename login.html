<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harpia - Entrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container my-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                
                <div class="card shadow-sm border-0 p-4 rounded-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold text-dark">Harpia</h2>
                        <p class="text-muted">Faça login para acessar sua conta</p>
                    </div>

                    <form id="formLogin" novalidate>
                        <div class="mb-3">
                            <label for="loginUsuario" class="form-label fw-semibold">Usuário (Login)</label>
                            <input type="text" class="form-control" id="loginUsuario" placeholder="Digite seu login de 6 letras" maxlength="6" required>
                            <span id="erro-loginUsuario" class="text-danger small mt-1" style="display: none;">Usuário incorreto ou não preenchido.</span>
                        </div>

                        <div class="mb-3">
                            <label for="senhaUsuario" class="form-label fw-semibold">Senha</label>
                            <input type="password" class="form-control" id="senhaUsuario" placeholder="Digite sua senha de 8 letras" maxlength="8" required>
                            <span id="erro-senhaUsuario" class="text-danger small mt-1" style="display: none;">Senha incorreta ou não preenchida.</span>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-bold">Enviar</button>
                        </div>

                        <hr class="text-muted my-4">

                        <div class="text-center">
                            <p class="text-muted small mb-2">Ainda não tem uma conta na Harpia?</p>
                            <a href="cadastro.html" class="btn btn-outline-secondary btn-sm w-100 rounded-3 fw-semibold">Cadastrar Novo Usuário</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
